<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAU Post-UTME — EDDYRUS🏅</title>
    <style>
        :root {
            --oau-blue: #001d3d;
            --oau-gold: #ffc300;
            --white: #ffffff;
            --dark: #000814;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--dark);
            color: var(--white);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Screens */
        #login-screen, #welcome-screen, #result-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 { color: var(--oau-gold); font-size: 3rem; margin: 10px 0; }
        
        .btn-eddyrus {
            background-color: var(--oau-gold);
            color: #000;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-size: 1.1rem;
            transition: 0.3s ease;
        }

        .btn-eddyrus:hover { transform: scale(1.05); }

        input[type="text"] {
            padding: 15px;
            width: 300px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 1rem;
            text-align: center;
        }

        /* Quiz Layout */
        #quiz-container {
            display: none;
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--oau-gold);
            padding-bottom: 15px;
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            background: var(--dark);
            z-index: 100;
        }

        #timer { font-size: 2rem; color: #ff595e; font-weight: bold; }

        .question-box {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            border-left: 6px solid var(--oau-gold);
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .option:hover { background: rgba(255,255,255,0.15); border-color: var(--oau-gold); }
        .option.selected { background: var(--oau-gold); color: #000; font-weight: bold; }

        .correction-card { text-align: left; background: rgba(0,0,0,0.4); padding: 20px; margin-top: 15px; border-radius: 10px; }
        
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <p style="letter-spacing: 2px;">OAU ASPIRANTS 2026</p>
        <h1>Candidate Login</h1>
        <input type="text" id="username" placeholder="Enter Your Full Name" autocomplete="off">
        <button class="btn-eddyrus" onclick="handleLogin()">Login</button>
    </div>

    <div id="welcome-screen" style="display:none;">
        <h1>Welcome.</h1>
        <p id="personal-welcome" style="font-size: 1.5rem; color: var(--oau-gold);"></p>
        <h2>EDDYRUS🏅 CBT Website</h2>
        <p>Aptitude Test Drill (General Paper)</p>
        <button class="btn-eddyrus" onclick="initiate()">Start 15-Min Drills</button>
    </div>

    <div id="quiz-container">
        <header>
            <div style="font-weight: bold; color: var(--oau-gold);">EDDYRUS🏅</div>
            <div id="timer">15:00</div>
        </header>
        <div id="questions-area"></div>
        <button class="btn-eddyrus" style="width:100%; margin-top: 30px;" onclick="finish()">Submit Test</button>
    </div>

    <div id="result-screen" style="display:none;">
        <h1 style="color: var(--oau-gold);">Examination Result</h1>
        <h2 id="final-score"></h2>
        <p id="candidate-name" style="font-style: italic;"></p>
        <button class="btn-eddyrus" onclick="review()">Review Corrections</button>
        <div id="review-area" style="display:none; margin-top: 40px; width: 100%; max-width: 800px;"></div>
    </div>

    <script>
        let aspirantName = "";

        function handleLogin() {
            const input = document.getElementById('username').value;
            if(input.trim() === "") {
                alert("Please enter your name to proceed.");
                return;
            }
            aspirantName = input;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'flex';
            document.getElementById('personal-welcome').innerText = aspirantName;
        }

        const questions = [
            { q: "Who was the first Vice Chancellor of the University of Ife (now OAU)?", o: ["Prof. Hezekiah Oluwasanmi", "Prof. Oladele Ajose", "Prof. Wande Abimbola", "Prof. Rogers Makanjuola"], a: 1, s: "Prof. Oladele Ajose was the first VC (1962-1966)." },
            { q: "Nigeria became a Republic in what year?", o: ["1960", "1963", "1966", "1970"], a: 1, s: "Nigeria became a republic on October 1, 1963." },
            { q: "The 'Great Ife' anthem was composed by:", o: ["Wole Soyinka", "Anthony Enahoro", "Students' Union Government", "OAU Music Dept"], a: 2, s: "The anthem is a traditional chant evolved by the student body." },
            { q: "Which Nigerian state is known as the 'Sunshine State'?", o: ["Osun", "Oyo", "Ondo", "Ekiti"], a: 2, s: "Ondo State is known as the Sunshine State." },
            { q: "Find the missing number in the sequence: 2, 6, 12, 20, ?", o: ["24", "26", "28", "30"], a: 3, s: "The difference increases by 2: (6-2=4, 12-6=6, 20-12=8, 20+10=30)." },
            { q: "How many local government areas are in Nigeria?", o: ["360", "774", "923", "500"], a: 1, s: "There are exactly 774 LGAs in Nigeria." },
            { q: "Choose the word most nearly opposite in meaning to 'Arrogant':", o: ["Humble", "Proud", "Selfish", "Vain"], a: 0, s: "Humble is the direct antonym of arrogant." },
            { q: "What is the capital of Osun State?", o: ["Ile-Ife", "Ede", "Osogbo", "Ilesa"], a: 2, s: "Osogbo is the capital of Osun State." },
            { q: "Who is the 'Visitor' to the University?", o: ["The VC", "The Governor of Osun", "The President of Nigeria", "The Chancellor"], a: 2, s: "The President of Nigeria serves as the Visitor to Federal Universities." },
            { q: "A polygon with eight sides is called an:", o: ["Hexagon", "Heptagon", "Octagon", "Nonagon"], a: 2, s: "An eight-sided polygon is an octagon." },
            { q: "Which body is responsible for conducting Post-UTME screenings?", o: ["JAMB", "WAEC", "Individual Universities", "ASUU"], a: 2, s: "Post-UTME is conducted by the individual universities." },
            { q: "The colors of the OAU flag are:", o: ["Blue and White", "Green and White", "Blue and Gold", "Gold and Red"], a: 2, s: "The official colors are Midnight Blue and Gold." },
            { q: "If a car travels at 60km/h, how far will it go in 15 minutes?", o: ["15km", "10km", "20km", "5km"], a: 0, s: "15 minutes is 1/4 of an hour. 60 / 4 = 15km." },
            { q: "Who is the father of Nigerian Nationalism?", o: ["Nnamdi Azikiwe", "Obafemi Awolowo", "Herbert Macaulay", "Tafawa Balewa"], a: 2, s: "Herbert Macaulay is often regarded as the father of Nigerian nationalism." },
            { q: "Which arm of government makes laws in Nigeria?", o: ["The Executive", "The Judiciary", "The Legislature", "The Military"], a: 2, s: "The Legislature (National Assembly) is the law-making body." },
            { q: "Identify the synonym of 'Diligent':", o: ["Lazy", "Hardworking", "Careless", "Slow"], a: 1, s: "Hardworking is a synonym for diligent." },
            { q: "In what year was the University of Ife renamed to Obafemi Awolowo University?", o: ["1977", "1987", "1997", "2007"], a: 1, s: "It was renamed in May 1987 in honor of Chief Obafemi Awolowo." },
            { q: "Which gas is most abundant in the Earth's atmosphere?", o: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], a: 2, s: "Nitrogen makes up about 78% of the atmosphere." },
            { q: "The current estimated population of Nigeria is over:", o: ["100 million", "150 million", "200 million", "300 million"], a: 2, s: "Nigeria's population is estimated to be over 200-250 million." },
            { q: "Which of these is NOT a core value of OAU?", o: ["Learning", "Culture", "Sports", "Integrity"], a: 2, s: "The university motto is 'For Learning and Culture'." },
            { q: "Who is on the 1000 Naira note?", o: ["Herbert Macaulay", "Nnamdi Azikiwe", "Aliyu Mai-Bornu & Clement Isong", "Murtala Mohammed"], a: 2, s: "Alhaji Aliyu Mai-Bornu and Dr. Clement Isong are on the 1000 Naira note." },
            { q: "Nigeria's independence was obtained from:", o: ["France", "USA", "Great Britain", "Germany"], a: 2, s: "Nigeria gained independence from Britain in 1960." },
            { q: "A student who excels in both character and learning is called:", o: ["A genius", "A scholar", "An Alumnus", "A Graduate"], a: 1, s: "OAU degrees are awarded based on finding the student worthy in 'learning and character'." },
            { q: "Which planet is known as the Red Planet?", o: ["Venus", "Jupiter", "Mars", "Saturn"], a: 2, s: "Mars is known as the Red Planet due to its iron oxide surface." },
            { q: "The first Nigerian to win a Nobel Prize is:", o: ["Chinua Achebe", "Wole Soyinka", "Ben Okri", "Cyprian Ekwensi"], a: 1, s: "Wole Soyinka won the Nobel Prize in Literature in 1986." },
            { q: "What does 'UTME' stand for?", o: ["University Tertiary Matriculation Exam", "Unified Tertiary Matriculation Examination", "United Tertiary Matriculation Exam", "Universal Tertiary Matriculation Exam"], a: 1, s: "UTME stands for Unified Tertiary Matriculation Examination." },
            { q: "Who is the female heroine associated with Moremi Hall in OAU?", o: ["Queen Amina", "Queen Moremi Ajasoro", "Funmilayo Ransome-Kuti", "Flora Shaw"], a: 1, s: "Queen Moremi of Ile-Ife is the heroine honored by the hall name." },
            { q: "How many states make up the Federal Republic of Nigeria?", o: ["30", "34", "36", "37"], a: 2, s: "There are 36 states in Nigeria." },
            { q: "The phrase 'Great Ife' is a symbol of:", o: ["Academic Pride", "Student Unity", "Both Academic & Student Pride", "Political Affiliation"], a: 2, s: "It represents the overall identity of the OAU community." },
            { q: "Which of these is the official motto of OAU?", o: ["Learning and Culture", "Knowledge is Power", "Excellence in Service", "Truth and Service"], a: 0, s: "The motto is 'For Learning and Culture'." }
        ];

        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 15 * 60;
        let timerInterval;

        function initiate() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            populate();
            tick();
        }

        function populate() {
            const area = document.getElementById('questions-area');
            questions.forEach((q, idx) => {
                const box = document.createElement('div');
                box.className = 'question-box';
                box.innerHTML = `<p><strong>${idx + 1}. ${q.q}</strong></p>
                    <div class="options-grid">
                        ${q.o.map((opt, i) => `<div class="option" id="q${idx}o${i}" onclick="pick(${idx}, ${i})">${opt}</div>`).join('')}
                    </div>`;
                area.appendChild(box);
            });
        }

        function pick(qIdx, oIdx) {
            userAnswers[qIdx] = oIdx;
            const opts = document.querySelectorAll(`#q${qIdx}o0, #q${qIdx}o1, #q${qIdx}o2, #q${qIdx}o3`);
            opts.forEach(o => o.classList.remove('selected'));
            document.getElementById(`q${qIdx}o${oIdx}`).classList.add('selected');
        }

        function tick() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) finish();
            }, 1000);
        }

        function finish() {
            clearInterval(timerInterval);
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            let score = 0;
            const rev = document.getElementById('review-area');
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.a) score++;
                rev.innerHTML += `<div class="correction-card">
                    <p><strong>${i+1}. ${q.q}</strong></p>
                    <p>Correct: <span style="color:#44ff44">${q.o[q.a]}</span></p>
                    <p style="font-size:0.9rem; opacity:0.7"><em>${q.s}</em></p>
                </div>`;
            });
            document.getElementById('final-score').innerText = `Score: ${score} / ${questions.length}`;
            document.getElementById('candidate-name').innerText = `Candidate: ${aspirantName}`;
            window.scrollTo(0,0);
        }

        function review() {
            const r = document.getElementById('review-area');
            r.style.display = r.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
